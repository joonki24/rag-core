# 정답표 형식 설정(묶음 ⑲, CHANGES.md Q18). 이름이 바뀌면 코드가 아니라 이 파일만 고친다.
# 파일이 없으면 아래 기본값(기존 6유형, 선택 열 없음)과 같게 동작한다. 모르는 칸이 있으면 멈춘다.

# 허용하는 질문 유형 이름. 하위 유형은 "상위 > 하위" 모양이고 상위 이름이 같은 것끼리 한 묶음이다.
types:
  - 사실 확인
  - 용어 다름
  - 변경 영향
  - 모순 찾기
  - 답변 불가
  - 부분 답변
  # 신규·복합 업무(정답지 작성자 제안, 2026-10-07). 이름은 정답지 작성자가 확정하기 전까지 가칭이다.
  - 신규·복합 > 기존 기능 변경
  - 신규·복합 > 새로운 결합
  - 신규·복합 > 신규 개념
  - 신규·복합 > 조건 미정
  # 평가셋 v0.5의 유형 이름(묶음 ㉒ V26, 가칭, 확인 대기). 읽는 방법은 gold_format_v05.yaml이다.
  - 신규 기능 도입 > N1
  - 신규 기능 도입 > N2
  - 기존 기능 결합
  - 기존 기능 변경·확장
  - 기존 사실·자료 범위 확인
  - 문서 간 차이 확인
  # 서비스 B 평가셋 v0.1의 유형 이름(묶음 72 D1b, 원본 이름 그대로). 읽는 방법은 gold_format_fmtb01.yaml이다.
  - 추가
  - 수정
  - 삭제
  # 서비스 C 평가셋의 유형 이름 중 위에 없는 것(묶음 82 S3, 원본 이름 그대로). 기존 기능 결합·기존 기능 변경·확장은 위에 이미 있다. 읽는 방법은 gold_format_fmtc01.yaml이다.
  - 신규 기능 N1
  - 신규 기능 N2
  - 기존 사실·자료 범위

unanswerable_type: 답변 불가     # 이 유형은 답변 가능 X와 짝이어야 한다
group_separator: " > "           # 상위와 하위 유형을 나누는 글자
condition_separator: ","         # "질문에 명시된 조건" 칸에서 조건을 나누는 글자(임시, 형식 확정 전)
always_word: 항상                # 적용 조건이 이 말이면 모든 질문에 적용

# 선택 열 이름. 정답표에 이 이름의 열이 있으면 그 기능을 쓰고, 없으면 쓰지 않는다.
columns:
  question_conditions: 질문에 명시된 조건      # 질문 정답표 시트
  evidence_condition: 적용 조건                # 질문별 근거 시트
  evidence_area: 검토 영역
  evidence_bundle: 대체 근거 묶음
  evidence_requirement: 요구사항 여부           # O 또는 X
