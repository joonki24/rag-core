# 평가 실험의 공통 고정값. 채점표(logs/채점표_사전등록_2026-10-02.md) §0, §1을 따른다.
# B0와 B1은 이 파일의 값이 모두 같아야 한다. 값을 바꾸면 변경 이력과 이유를 남긴다.
# settings.py가 읽을 때 채점표 고정값을 어기면 오류로 멈춘다.

embedding:
  backend: local            # 외부 전송 금지(마스킹본). local만 허용
  model: BAAI/bge-m3        # 확정(2026-10-12 사용자 확인). 후보 비교 근거는 logs/decisions.md

retrieval:
  distance: cosine          # 채점표 §1
  candidate_pool: 100       # 근거 모으기에 넘기는 후보 수. 예산을 채우고도 남을 만큼 충분해야 한다(채점표 변경 14: 50 -> 100)
  rerank: false             # 메인 비교에서는 끈다
  query_decomposition: false

evidence:
  token_budget: 4000        # 모델에 넘기는 근거 총 토큰(채점표 §0 ②, 변경 14: 1500 -> 4000)
  tokenizer: cl100k_base    # tiktoken. 청크 text의 토큰 합을 센다

generation:
  temperature: 0            # 채점표 §0 ⑤
  seed: 0

dataset: shop               # 서랍 이름 = {dataset}_{방식}(예: shop_b0_r). 데이터셋이 다르면 서랍이 달라 섞이지 않는다(묶음 ⑰ R2). 소문자·숫자·밑줄

storage:
  chroma_dir: chroma_db     # 상대 경로는 이 파일이 있는 폴더 기준. git에서 제외된 폴더여야 한다(.gitignore의 chroma_db/)

links:                      # 연결 따라가기(B1 검색+연결 팔에서만 쓴다). 첫 B1 평가 전까지만 바꿀 수 있다
  search_share: 0.5         # 근거 예산 중 검색 결과 몫. 나머지는 연결 몫(연결이 모자라 남으면 검색 결과로 이어서 채운다)
  grades: [explicit, structural]   # 따라가는 연결 등급. 추정(inferred)은 넣을 수 없다
  hops: 1                   # 기본값 1단계(2026-10-12 사용자 결정, 묶음 ㊿ R2). all = 끝까지(옛 방식, 설정 파일에서 지정). 정수 N = N단계까지. 연결에는 방향이 없다
  group_top_n: 3            # 묶음 연결에서 질문과 가까운 순으로 담을 항목 수
  link_order: distance      # 연결로 담을 항목 순서. 질문과 가까운 순(2026-10-12 사용자 결정, 묶음 ㊿ R3). item_number = 항목 번호 순(옛 방식)
